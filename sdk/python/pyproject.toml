[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svitch"
version = "0.1.0"
description = "Multi-provider LLM routing — auto model selection, failover, and prompt-cache stabilization, OpenAI-compatible."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["llm", "router", "gateway", "openai", "anthropic", "failover", "caching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
all = ["openai>=1.0.0", "anthropic>=0.25.0"]

[project.urls]
Homepage = "https://svitch.ai"
Repository = "https://github.com/koushiknarendra/svitch"
Issues = "https://github.com/koushiknarendra/svitch/issues"

[tool.hatch.build.targets.wheel]
packages = ["svitch"]
